# RigorMobile — E2E: Playwright against a prod Next.js build
#
# Triggers on pushes to main and on PRs. Builds the web app once, then runs
# the Playwright suite in parallel across Chromium + mobile-chrome projects.
# Average warm-run: ~2 min; cold-run: ~5 min (Next build dominates).

name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.0

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .turbo
            **/node_modules
          key: ${{ runner.os }}-bun-e2e-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: apps/web
        env:
          DATABASE_URL: 'file:./test.db'
          CI: 'true'
        run: bunx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
