# RigorMobile — Auto-fix: prettier --write + eslint --fix, then commit
#
# Triggers on pushes to main. Runs Prettier + ESLint with --fix across the
# whole repo, then commits the changes back to main with `[auto-fix]` in
# the message. Uses a fine-grained PAT stored in the `AUTO_FIX_PAT` secret.
#
# If there's nothing to fix, the workflow is a no-op (no empty commits).
#
# Required repo secrets:
#   AUTO_FIX_PAT  — a fine-grained PAT with `contents: write` on this repo.
#                   DO NOT hard-code tokens in this file. If you don't have
#                   one yet, this workflow will skip the commit step gracefully.

name: Auto-fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-fix
  cancel-in-progress: false

jobs:
  auto-fix:
    name: Prettier + ESLint --fix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_FIX_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.0

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            **/node_modules
          key: ${{ runner.os }}-bun-autofix-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run Prettier --write
        run: bun run format

      - name: Run ESLint --fix (web)
        working-directory: apps/web
        run: bunx eslint . --fix || true

      - name: Run ESLint --fix (rigor-core)
        working-directory: packages/rigor-core
        run: bunx eslint src --fix || true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit fixes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(auto-fix): prettier + eslint --fix [skip ci]"
          git push
