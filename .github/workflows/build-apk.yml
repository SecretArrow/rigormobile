# RigorMobile — Build Android APK via Gradle
#
# Triggers on pushes to main, on tags matching v*, and manually. Uses Expo
# prebuild to generate the native android/ folder, then runs Gradle
# assembleRelease to produce a signed (or debug-signed if no keystore) APK.
#
# Required repo secrets (for signed release builds):
#   ANDROID_KEYSTORE_BASE64   — base64 of your release.keystore
#   ANDROID_KEYSTORE_PASSWORD — keystore password
#   ANDROID_KEY_ALIAS         — key alias inside the keystore
#   ANDROID_KEY_PASSWORD      — key password
#
# If any secret is missing, the workflow falls back to a debug-signed APK
# (still installable on dev devices, but not Play-Store-ready).
#
# Average cold-build: ~9 min; warm incremental: ~3 min (Gradle + SDK cached).

name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'packages/rigor-core/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/android/android/.gradle
            apps/android/android/app/build
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android/android/**/*.gradle*', 'apps/android/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            **/node_modules
          key: ${{ runner.os }}-bun-apk-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build @rigormobile/rigor-core (for RN consumption)
        working-directory: packages/rigor-core
        run: bun run build || true

      - name: Expo prebuild (Android)
        working-directory: apps/android
        run: bunx expo prebuild --platform android --clean

      - name: Decode keystore (if secret present)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/android/android/app/release.keystore
          echo "Keystore deployed."

      - name: Configure signing props
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: apps/android/android
        run: |
          cat >> app/build.gradle <<'EOF'

          // Injected by build-apk.yml — signing config for release builds.
          android {
            signingConfigs {
              release {
                storeFile file('release.keystore')
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF

      - name: Gradle assembleRelease (signed)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: apps/android/android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Gradle assembleRelease (debug-signed fallback)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        working-directory: apps/android/android
        run: ./gradlew assembleRelease --no-daemon -Pandroid.injected.build.abi=arm64-v8a,armeabi-v7a,x86_64 --stacktrace

      - name: Locate APK
        id: apk
        working-directory: apps/android/android
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "path=$(pwd)/${APK}" >> $GITHUB_OUTPUT
          ls -la "${APK}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rigormobile-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload APK to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
